; Read by PHP-FPM per directory (when user_ini.filename is enabled, which is the
; default). config/takeoff.php's own ceiling (TAKEOFF_MAX_FILE_SIZE_MB) sits on
; top of these — see App\Support\UploadLimits, which takes the lower of the two
; so the app never promises more than the server actually accepts.
;
; post_max_size is set well above upload_max_filesize so it never becomes the
; binding constraint on its own — up to takeoff.uploads.max_files (8) PDFs can
; be picked in one request.
upload_max_filesize = 512M
post_max_size = 2G
memory_limit = 512M
max_execution_time = 300
