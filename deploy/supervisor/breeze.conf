# Supervisor configuration for Breeze's two long-running application
# processes: the Reverb WebSocket server and the queue worker (which is what
# actually delivers every ShouldBroadcast event to Reverb, along with the
# app's existing AI-takeoff/notification/activity jobs).
#
# Install:
#   cp deploy/supervisor/breeze.conf /etc/supervisor/conf.d/breeze.conf
#   # edit the two `directory`/`user` lines below for this server
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start breeze-reverb:* breeze-queue:*
#
# Deploy (after `php artisan reverb:restart` / `php artisan queue:restart`,
# Supervisor's `autorestart` brings each process back automatically — these
# artisan commands just signal a graceful stop, not a Supervisor action):
#   php artisan queue:restart
#   php artisan reverb:restart

[program:breeze-reverb]
process_name=%(program_name)s
command=php /var/www/breeze/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/breeze
user=www-data
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
stdout_logfile=/var/www/breeze/storage/logs/reverb.log
stderr_logfile=/var/www/breeze/storage/logs/reverb-error.log
stopasgroup=true
killasgroup=true

[program:breeze-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/breeze/artisan queue:work --tries=3 --backoff=10 --timeout=120 --sleep=3
directory=/var/www/breeze
user=www-data
numprocs=2
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stdout_logfile=/var/www/breeze/storage/logs/queue-worker.log
stderr_logfile=/var/www/breeze/storage/logs/queue-worker-error.log
stopasgroup=true
killasgroup=true
